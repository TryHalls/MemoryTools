<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MemoryTool</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<!-- El servidor sustituye __MEMORYTOOL_TOKEN__ por el token real de la
     ejecucion al servir esta pagina. El token NUNCA aparece en URLs ni se
     pide por query string. -->
<script>window.MEMORYTOOL_TOKEN = "__MEMORYTOOL_TOKEN__";</script>

<header id="app-header">
  <div class="brand">MemoryTool</div>
  <div class="status-box">
    <span id="conn-dot" class="dot off"></span>
    <span id="conn-label">Desconectado</span>
    <span id="pid-label" class="pid">PID: --</span>
  </div>
  <div class="actions">
    <button id="btn-detach" class="btn" disabled>Detach</button>
  </div>
</header>

<div id="app-body">
  <aside id="sidebar">
    <div class="side-title">
      <span>Procesos</span>
      <button id="btn-refresh" class="btn small">Refresh</button>
    </div>
    <div id="proc-list" class="proc-list"></div>
  </aside>

  <main id="main">
    <div class="tab-bar">
      <button class="tab active" data-tab="scan">Scan</button>
      <button class="tab" data-tab="memory">Memory</button>
      <button class="tab" data-tab="table">Address Table</button>
      <button class="tab" data-tab="pattern">Pattern</button>
      <button class="tab" data-tab="pointers">Pointers</button>
    </div>

    <!-- Job box global: un solo job pesado a la vez, visible en toda pestaña. -->
    <div id="job-box" class="job-box hidden">
      <span id="job-state" class="job-state">--</span>
      <div class="job-bar"><div id="job-fill" class="job-fill"></div></div>
      <span id="job-info" class="job-info"></span>
      <button id="btn-cancel" class="btn small danger">Cancel</button>
    </div>

    <!-- ============ PESTAÑA SCAN ============ -->
    <section id="panel-scan" class="tabpanel active">
      <div class="scan-controls">
        <label>Type
          <select id="scan-type">
            <option value="int8">int8</option>
            <option value="int16">int16</option>
            <option value="int32" selected>int32</option>
            <option value="int64">int64</option>
            <option value="uint8">uint8</option>
            <option value="uint16">uint16</option>
            <option value="uint32">uint32</option>
            <option value="uint64">uint64</option>
            <option value="float">float</option>
            <option value="double">double</option>
            <!-- string / bytes / pointer se anadiran en fases posteriores
                 sin rehacer la ventana: basta con anadir la opcion aqui y
                 ajustar el body de first/next. -->
          </select>
        </label>
        <label>Filter
          <select id="scan-filter">
            <option value="changed" selected>changed</option>
            <option value="unchanged">unchanged</option>
            <option value="exact">exact</option>
            <option value="increased">increased</option>
            <option value="decreased">decreased</option>
          </select>
        </label>
        <label>Value
          <input id="scan-value" type="text" placeholder="12345">
        </label>
        <button id="btn-first" class="btn primary">FIRST</button>
        <button id="btn-next" class="btn">NEXT</button>
        <button id="btn-unknown" class="btn">UNKNOWN</button>
      </div>

      <div id="scan-detail" class="sel-detail hidden"></div>
      <div class="results-head">
        <span class="col-addr">Address</span>
        <span class="col-val">Value</span>
        <span class="col-type">Type</span>
      </div>
      <div id="vt" class="vt"></div>
    </section>

    <!-- ============ PESTAÑA MEMORY ============ -->
    <section id="panel-memory" class="tabpanel">
      <div class="scan-controls">
        <label>Address
          <input id="mem-addr" type="text" placeholder="0x...">
        </label>
        <label>Length
          <input id="mem-len" type="text" value="256">
        </label>
        <button id="btn-mem-read" class="btn primary">Read</button>
        <button id="btn-mem-prev" class="btn" title="Página anterior">Prev</button>
        <button id="btn-mem-next" class="btn" title="Página siguiente">Next</button>
        <button id="btn-mem-refresh" class="btn">Refresh</button>
        <button id="btn-mem-copy" class="btn">Copy Hex</button>
      </div>
      <div id="mem-region" class="mem-region"></div>
      <div id="mem-hex" class="mem-hex mono"></div>
    </section>

    <!-- ============ PESTAÑA ADDRESS TABLE ============ -->
    <section id="panel-table" class="tabpanel">
      <div class="scan-controls">
        <label>Address
          <input id="tbl-addr" type="text" placeholder="0x...">
        </label>
        <label>Type
          <select id="tbl-type">
            <option value="int32" selected>int32</option>
            <option value="int8">int8</option>
            <option value="int16">int16</option>
            <option value="int64">int64</option>
            <option value="uint8">uint8</option>
            <option value="uint16">uint16</option>
            <option value="uint32">uint32</option>
            <option value="uint64">uint64</option>
            <option value="float">float</option>
            <option value="double">double</option>
          </select>
        </label>
        <label>Description
          <input id="tbl-desc" type="text" placeholder="dinero">
        </label>
        <button id="btn-tbl-add" class="btn primary">Add</button>
        <button id="btn-tbl-refresh" class="btn">Refresh</button>
      </div>
      <div class="scan-controls">
        <label>File
          <input id="tbl-file" type="text" placeholder="tabla1" value="tabla1">
        </label>
        <button id="btn-tbl-save" class="btn">Save</button>
        <button id="btn-tbl-load" class="btn">Load</button>
      </div>
      <div id="tbl-detail" class="tbl-detail hidden"></div>
      <div class="tbl-wrap">
        <table id="tbl-table" class="tbl">
          <thead>
            <tr>
              <th>ID</th><th>Address / Module</th><th>Type</th>
              <th>Description</th><th>On</th><th>Stale</th><th>Kind</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tbl-body"></tbody>
        </table>
      </div>
    </section>

    <!-- ============ PESTAÑA PATTERN ============ -->
    <section id="panel-pattern" class="tabpanel">
      <div class="scan-controls">
        <label>Modo
          <select id="pat-mode">
            <option value="aob">AOB / Bytes</option>
            <option value="string">String</option>
          </select>
        </label>
        <label id="pat-pattern-label">Pattern
          <input id="pat-pattern" type="text" placeholder="48 8B ?? ?? 48 85 C0">
        </label>
        <label id="pat-text-label" class="hidden">Text
          <input id="pat-text" type="text" placeholder="hola memorytool">
        </label>
        <button id="btn-pat-scan" class="btn primary">Scan</button>
        <label>Next
          <select id="pat-filter">
            <option value="changed">changed</option>
            <option value="unchanged">unchanged</option>
            <option value="exact" selected>exact</option>
          </select>
        </label>
        <button id="btn-pat-next" class="btn">Next</button>
      </div>
      <div id="pat-detail" class="sel-detail hidden"></div>
      <div class="results-head">
        <span class="col-addr">Address</span>
        <span id="pat-col-val" class="col-val">Match</span>
        <span id="pat-col-type" class="col-type"></span>
      </div>
      <div id="vt-pattern" class="vt"></div>
    </section>

    <!-- ============ PESTAÑA POINTERS ============ -->
    <section id="panel-pointers" class="tabpanel">
      <div class="scan-controls">
        <label>Target
          <input id="ptr-target" type="text" placeholder="0x...">
        </label>
        <label>Depth
          <input id="ptr-depth" type="text" value="3" size="3">
        </label>
        <label>Max Offset
          <input id="ptr-maxoff" type="text" value="0x100" size="6">
        </label>
        <label>Step
          <input id="ptr-step" type="text" value="8" size="3">
        </label>
        <label class="chk"><input id="ptr-module" type="checkbox"> Module only</label>
        <label class="chk"><input id="ptr-code" type="checkbox"> Include code</label>
        <label>Value type
          <select id="ptr-vtype">
            <option value="int32" selected>int32</option>
            <option value="int8">int8</option>
            <option value="int16">int16</option>
            <option value="int64">int64</option>
            <option value="uint8">uint8</option>
            <option value="uint16">uint16</option>
            <option value="uint32">uint32</option>
            <option value="uint64">uint64</option>
            <option value="float">float</option>
            <option value="double">double</option>
          </select>
        </label>
        <button id="btn-ptr-scan" class="btn primary">SCAN POINTERS</button>
      </div>
      <div id="ptr-detail" class="sel-detail hidden"></div>
      <div class="results-head">
        <span class="col-addr">#</span>
        <span class="col-val">Depth</span>
        <span class="col-type">Chain</span>
      </div>
      <div id="vt-pointer" class="vt"></div>
    </section>
  </main>
</div>

<footer id="app-footer">
  <span id="footer-msg">Listo.</span>
</footer>

<script src="/app.js"></script>
</body>
</html>
